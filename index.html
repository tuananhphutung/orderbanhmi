    <script>
      // Silence Tailwind CDN warning for production
      (function() {
        var originalWarn = console.warn;
        console.warn = function(message) {
          if (typeof message === 'string' && message.includes('cdn.tailwindcss.com')) return;
          originalWarn.apply(console, arguments);
        };
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

      body {
        font-family: 'Inter', sans-serif;
        overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile app feel */
        -webkit-tap-highlight-color: transparent; /* Remove highlight on tap */
        user-select: none; /* Make it feel native */
        background-color: #fff7ed; /* orange-50 */
      }
      input, textarea {
        user-select: text;
      }
    </style>

  <body>

    <script>
      // Standard SW Registration using 'service-worker.js' to avoid 404
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('SW Registered Scope:', reg.scope))
            .catch(err => console.log('SW Error:', err));
        });
      }
    </script>
